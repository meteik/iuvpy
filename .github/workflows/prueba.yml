
name: Prueba IUVPY

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar Python
        run: |
          python --version
          echo "IUVPY funciona correctamente"

      - name: Verificar secreto CAMS
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          if [ -z "$ADS_API_KEY" ]; then
            echo "Falta configurar ADS_API_KEY"
            exit 1
          fi
          echo "Secreto CAMS configurado correctamente"
