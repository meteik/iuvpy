
name: Generar pronóstico IUVPY

on:
  workflow_dispatch:

  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar librerías
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gdown

      # 4. Descargar DEM desde Google Drive
      - name: Descargar DEM_PY.tif
        env:
          TIF_DRIVE_ID: ${{ secrets.TIF_DRIVE_ID }}
        run: |
          mkdir -p assets

          gdown --fuzzy "https://drive.google.com/file/d/${TIF_DRIVE_ID}/view?usp=sharing" \
            -O assets/DEM_PY.tif

          ls -lh assets/DEM_PY.tif
          test -s assets/DEM_PY.tif

      # 5. Ejecutar procesamiento
      - name: Ejecutar IUVPY
        run: python run_iuvpy.py

      # 6. Verificar mapas generados
      - name: Verificar resultados
        run: |
          echo "Archivos generados:"
          find site -type f
