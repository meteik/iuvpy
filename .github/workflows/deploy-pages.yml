

name: Publicar web IUVPY

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos de la web
        run: |
          echo "Contenido de la carpeta site:"
          ls -la site

          if [ ! -f site/index.html ]; then
            echo "ERROR: No existe site/index.html"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

