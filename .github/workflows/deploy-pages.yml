
name: Generar pronóstico IUVPY

on:
  schedule:
    - cron: "30 0 * * *" # PRUEBA automática 00:30 UTC
    - cron: "0 12 * * *" # CAMS 00Z - 09:00 Paraguay
    - cron: "0 19 * * *" # GFS 12Z - 16:00 Paraguay
    - cron: "0 23 * * *" # CAMS 12Z - 20:00 Paraguay

  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo a ejecutar manualmente"
        required: true
        type: choice
        default: todos
        options:
          - todos
          - cams00
          - gfs12
          - cams12

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest

    env:
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
      MPLBACKEND: Agg

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configurar fecha UTC
        run: |
          echo "RUN_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          date -u

      # PRUEBA: se ejecuta únicamente con el cron 00:30 UTC
      - name: Prueba automática 00:30Z
        if: github.event_name == 'schedule' && github.event.schedule == '30 0 * * *'
        run: |
          echo "CORRECTO: GitHub Actions se disparó automáticamente."
          echo "Horario programado: 00:30 UTC"
          date -u

      - name: Instalar dependencias
        if: github.event.schedule != '30 0 * * *'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar credenciales CAMS
        if: github.event.schedule != '30 0 * * *'
        run: |
          test -n "$ADS_API_KEY" || { echo "ERROR: Falta ADS_API_KEY"; exit 1; }
          printf 'url: https://ads.atmosphere.copernicus.eu/api\nkey: %s\n' "$ADS_API_KEY" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"

      - name: Verificar estructura y secretos
        if: github.event.schedule != '30 0 * * *'
        run: |
          set -e
          for f in run_iuvpy.py drive_sync.py requirements.txt scripts/gfs_iuv.py scripts/cams_iuv.py assets/Departamentos_Paraguay.shp assets/Departamentos_Paraguay.shx assets/Departamentos_Paraguay.dbf assets/Departamentos_Paraguay.prj assets/NORTE.png site/index.html; do
            test -f "$f" || { echo "Falta archivo: $f"; exit 1; }
          done
          for v in GOOGLE_DRIVE_FOLDER_ID GOOGLE_REFRESH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            test -n "${!v}" || { echo "ERROR: Falta secreto $v"; exit 1; }
          done
          echo "Estructura y credenciales verificadas."

      - name: Ejecutar CAMS 00Z
        if: (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.modelo == 'cams00' || inputs.modelo == 'todos'))
        env:
          IUVPY_MODEL: cams
          RUN_HOUR: "00"
        run: python run_iuvpy.py

      - name: Ejecutar GFS 12Z
        if: (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.modelo == 'gfs12' || inputs.modelo == 'todos'))
        env:
          IUVPY_MODEL: gfs
          RUN_HOUR: "12"
        run: python run_iuvpy.py

      - name: Ejecutar CAMS 12Z
        if: (github.event_name == 'schedule' && github.event.schedule == '0 23 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.modelo == 'cams12' || inputs.modelo == 'todos'))
        env:
          IUVPY_MODEL: cams
          RUN_HOUR: "12"
        run: |
          RUN_DATE=$(date -u +%Y%m%d)
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          export RUN_DATE
          python run_iuvpy.py

      - name: Verificar mapas publicados
        if: github.event.schedule != '30 0 * * *'
        run: |
          set -e
          test -s site/index.html
          test -s site/maps/GFS_latest.png
          test -s site/maps/CAMS_00_latest.png
          test -s site/maps/CAMS_12_latest.png
          test -s site/status.json
          ls -lh site/maps

      - name: Configurar GitHub Pages
        if: github.event.schedule != '30 0 * * *'
        uses: actions/configure-pages@v5

      - name: Subir archivos para GitHub Pages
        if: github.event.schedule != '30 0 * * *'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./site
          retention-days: 1

      - name: Publicar GitHub Pages
        if: github.event.schedule != '30 0 * * *'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar URL
        if: github.event.schedule != '30 0 * * *'
        run: |
          echo "IUVPY publicado: ${{ steps.deployment.outputs.page_url }}"
